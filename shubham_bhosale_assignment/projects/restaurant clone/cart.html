<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="/cart.css"
</head>
<body>

<section class="cart-section">
    <h2 class="section-title">Your Cart</h2>

    <div class="cart-container">

        <!-- Cart Item 1 -->
        <div class="cart-card">
            <div class="img">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1kdJ3tXw6Hj44KUuGpe_2Dom3d-mQbmeeFA&s" alt="Mutton Thali" class="cart-img">
            </div>

            <div class="cart-details">
                <h3>Mutton Thali</h3>
                <p class="price">Price: ₹250</p>
            </div>

            <div class="cart-qty">
                <label>Qty:</label>
                <input type="number" value="1" min="1">
            </div>

            <div class="cart-total">
                <p>Total: ₹250</p>
            </div>
        </div>

        <!-- Cart Item 2 -->
        <div class="cart-card">
            <div class="img">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJ2WY2YmIJtXrpmDToEHwJIOAcyBefjpFwXg&s" alt="Paneer Tikka" class="cart-img">
            </div>

            <div class="cart-details">
                <h3>Paneer Tikka</h3>
                <p class="price">Price: ₹150</p>
            </div>

            <div class="cart-qty">
                <label>Qty:</label>
                <input type="number" value="2" min="1">
            </div>

            <div class="cart-total">
                <p>Total: ₹300</p>
            </div>
        </div>

    </div>

    <!-- Grand Total Section -->
    <div class="cart-summary">
        <h3>Grand Total: ₹550</h3>
        <button class="checkout-btn">Proceed to Checkout</button>
    </div>

</section>

</body>
</html>
